name: Turnstile Registration Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/turnstile-registration-hotfix-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Turnstile patch
        shell: bash
        run: |
          python3 scripts/apply-turnstile-hotfix.py

      - name: Verify Turnstile patch
        shell: bash
        run: |
          git diff --check
          grep -F 'data-sitekey="0x4AAAAAAEr2vHuiXic1UKjI"' rewards.html
          grep -F 'turnstileToken,' rewards.html
          grep -F 'await verifyRegistrationTurnstile(payload);' edge-functions/kweider-rewards-api/index.ts
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('rewards.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/rewards-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/rewards-inline.js

      - name: Commit Turnstile patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rewards.html edge-functions/kweider-rewards-api/index.ts
          git commit -m "Protect rewards registration with Turnstile"
          git push origin main
