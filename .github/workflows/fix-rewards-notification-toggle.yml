name: Fix Rewards notification toggle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-rewards-notification-toggle.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove forced hidden notification button rule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('rewards.html')
          s = p.read_text()
          old = '      #disableNotifications { display: none !important; }\n'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one forced-hide rule, found {count}')
          p.write_text(s.replace(old, '', 1))
          PY
          git diff --check
          if grep -Fq '#disableNotifications { display: none !important; }' rewards.html; then
            echo 'Forced-hide rule still present' >&2
            exit 1
          fi
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rewards.html
          git commit -m 'Fix notification toggle visibility'
          git push origin HEAD:main
