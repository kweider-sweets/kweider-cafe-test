name: Fix Cream Wardat card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cream-wardat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Cream Wardat fix
        run: python3 scripts/fix-cream-wardat.py

      - name: Validate narrow change
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          diff = subprocess.check_output(['git','diff','--','index.html'], text=True)
          if 'Cream Wardat' not in diff:
              raise SystemExit('Expected Cream Wardat diff not found')
          forbidden = ['service-worker.js','rewards.html','staff.html','staff-app/index.html']
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          if changed != ['index.html']:
              raise SystemExit(f'Unexpected changed files: {changed}')
          text = Path('index.html').read_text(encoding='utf-8')
          marker = 'data-name-en="Cream Wardat"'
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('Cream Wardat missing')
          start = text.rfind('<div', 0, pos)
          end = text.find('>', pos)
          tag = text[start:end+1]
          for required in ['data-price="£3.00"','data-img="wardat.webp"']:
              if tag.count(required) != 1:
                  raise SystemExit(f'Invalid {required}')
          if 'data-allergy=' in tag:
              raise SystemExit('Allergy data unexpectedly added')
          PY

      - name: Commit interface-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-cream-wardat.yml scripts/fix-cream-wardat.py
          git add index.html
          git commit -m "Fix Cream Wardat details card"
          git push origin main
