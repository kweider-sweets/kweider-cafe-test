name: Fix Single Serving spacing
on:
  push:
    paths:
      - 'scripts/fix-single-serving-spacing.py'
      - '.github/workflows/fix-single-serving-spacing.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply exact spacing fix
        run: python3 scripts/fix-single-serving-spacing.py
      - name: Verify only index changed
        run: |
          git diff --check
          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = "index.html"
          grep -q 'src="Single‑Serving Selection.webp"' index.html
          grep -q 'data-img="Single‑Serving Selection.webp"' index.html
          ! grep -q 'src=" Single‑Serving Selection.webp"' index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Single Serving image path spacing"
          git push origin main
