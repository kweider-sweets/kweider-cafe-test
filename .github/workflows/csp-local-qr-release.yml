name: CSP and local QR release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/csp-local-qr-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vendor official html5-qrcode v2.3.8
        shell: bash
        run: |
          mkdir -p assets/vendor
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/mebjas/html5-qrcode/v2.3.8/minified/html5-qrcode.min.js \
            -o assets/vendor/html5-qrcode.min.js
          test "$(git hash-object assets/vendor/html5-qrcode.min.js)" = "18db263dbdc958f63f14c4904cb7e2124c766ecc"

      - name: Apply CSP and local QR patch
        shell: bash
        run: python3 scripts/patch-csp-and-local-qr.py

      - name: Validate release
        shell: bash
        run: |
          git diff --check
          node --check assets/js/rewards-page.js
          node --check assets/js/staff-page.js
          node --check assets/js/staff-app-install.js
          node --check assets/js/staff-app-page.js
          node --check assets/vendor/html5-qrcode.min.js
          node --check service-worker.js
          node --check staff-app/service-worker.js

          ! grep -R -n "cdnjs.cloudflare.com" staff.html staff-app/index.html
          ! grep -R -n "Math.random()" staff.html staff-app/index.html
          ! grep -R -n "qw.co.uk@gmail.com" staff.html staff-app/index.html

          grep -n "Content-Security-Policy" rewards.html
          grep -n "Content-Security-Policy" staff.html
          grep -n "Content-Security-Policy" staff-app/index.html
          grep -n "assets/vendor/html5-qrcode.min.js" staff.html
          grep -n "../assets/vendor/html5-qrcode.min.js" staff-app/index.html
          grep -n "assets/js/rewards-page.js" rewards.html
          grep -n "assets/js/staff-page.js" staff.html
          grep -n "../assets/js/staff-app-page.js" staff-app/index.html

          python3 - <<'PY'
          from pathlib import Path
          import re
          for filename in ['rewards.html','staff.html','staff-app/index.html']:
              text=Path(filename).read_text(encoding='utf-8')
              scripts=re.findall(r'<script([^>]*)>(.*?)</script>', text, flags=re.I|re.S)
              inline=[body for attrs,body in scripts if 'src=' not in attrs.lower() and body.strip()]
              assert not inline, f'{filename}: inline JS remains'
              assert not re.search(r'\son[a-zA-Z]+\s*=', text), f'{filename}: inline handler remains'
              csp=re.search(r'Content-Security-Policy"\s+content="([^"]+)', text, re.I)
              assert csp, f'{filename}: CSP missing'
              assert "script-src 'self' 'unsafe-inline'" not in csp.group(1), f'{filename}: unsafe-inline allowed in script-src'
              assert "script-src-attr 'none'" in csp.group(1), f'{filename}: script attributes not blocked'
          PY

      - name: Commit release and remove temporary tooling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/csp-local-qr-release.yml
          git rm scripts/patch-csp-and-local-qr.py
          git add rewards.html staff.html staff-app/index.html service-worker.js staff-app/service-worker.js assets/js/rewards-page.js assets/js/staff-page.js assets/js/staff-app-install.js assets/js/staff-app-page.js assets/vendor/html5-qrcode.min.js
          git commit -m "Add CSP and vendor staff QR scanner"
          git push origin main
