name: Registration Rate Limit Hotfix v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/registration-rate-limit-hotfix-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply registration rate limit patch
        run: python3 scripts/apply-registration-rate-limit.py

      - name: Validate
        run: |
          git diff --check
          grep -n 'enforceRegistrationRateLimit' edge-functions/kweider-rewards-api/index.ts
          grep -n 'kweider_check_registration_rate_limit' edge-functions/kweider-rewards-api/index.ts
          grep -n 'createMembership(payload, ctx.supabaseAdmin, req)' edge-functions/kweider-rewards-api/index.ts

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edge-functions/kweider-rewards-api/index.ts
          git commit -m "Enforce rate limits on new rewards registrations"
          git push origin main
