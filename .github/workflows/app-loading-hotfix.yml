name: App Loading Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-loading-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove artificial loading delay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('assets/js/app-shell.js')
          text = app.read_text(encoding='utf-8')
          old = '''  document.addEventListener("DOMContentLoaded", () => {\n    updateHomeBadge();\n    setTimeout(() => {\n      const l = document.getElementById("appLoading");\n      if (l) {\n        l.style.opacity = "0";\n        setTimeout(() => l.remove(), 380);\n      }\n    }, 250);\n  });'''
          new = '''  document.addEventListener("DOMContentLoaded", () => {\n    updateHomeBadge();\n    const loading = document.getElementById("appLoading");\n    if (loading) {\n      loading.style.opacity = "0";\n      loading.addEventListener(\n        "transitionend",\n        () => loading.remove(),\n        { once: true },\n      );\n    }\n  });'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected loading block exactly once, found {text.count(old)}')
          app.write_text(text.replace(old, new), encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          old_cache = 'const CACHE = "kweider-customer-v4.5.7";'
          new_cache = 'const CACHE = "kweider-customer-v4.5.8";'
          if sw_text.count(old_cache) != 1:
              raise SystemExit('Expected customer cache version v4.5.7 exactly once')
          sw.write_text(sw_text.replace(old_cache, new_cache), encoding='utf-8')
          PY

      - name: Verify isolated loading change
        shell: bash
        run: |
          git diff --check
          node --check assets/js/app-shell.js
          ! grep -n 'setTimeout.*250\|}, 250);\|380' assets/js/app-shell.js
          grep -n 'transitionend' assets/js/app-shell.js
          grep -n 'kweider-customer-v4.5.8' service-worker.js

      - name: Commit loading hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app-shell.js service-worker.js
          git commit -m "Remove artificial app loading delay"
          git push origin main
