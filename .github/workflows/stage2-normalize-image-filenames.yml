name: Stage 2 normalize image filenames
on:
  push:
    paths:
      - '.github/workflows/stage2-normalize-image-filenames.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage2-image-rename-work
          fetch-depth: 0
      - name: Prepare current Coming image safely
        run: |
          set -euo pipefail
          test -f 'COMING.webp'
          test ! -e 'coming soon.webp'
          test "$(git hash-object -- 'COMING.webp')" = "69257e270815cb0f9103a6742f5e89a75cfa2b91"
          git mv -- 'COMING.webp' 'coming soon.webp'
          cp scripts/stage2-normalize-image-filenames.py /tmp/stage2.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/stage2.py')
          s=p.read_text(encoding='utf-8')
          old='"coming soon.webp": "fdb1603cea87a17fc646adeafc3f0d4c09218348"'
          new='"coming soon.webp": "69257e270815cb0f9103a6742f5e89a75cfa2b91"'
          if s.count(old) != 1:
              raise SystemExit('Expected Coming blob mapping was not found exactly once')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Run guarded image rename
        run: python3 /tmp/stage2.py
      - name: Validate exact scope
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          raw = subprocess.check_output(['git','diff','--name-only','--no-renames','-z','HEAD'])
          changed=[p.decode('utf-8') for p in raw.split(b'\0') if p]
          bad=[p for p in changed if p != 'index.html' and not p.lower().endswith('.webp')]
          if bad:
              raise SystemExit(f'Unexpected changed files: {bad}')
          if 'index.html' not in changed:
              raise SystemExit('index.html was not changed')
          webps=[p for p in changed if p.lower().endswith('.webp')]
          if len(webps) < 51:
              raise SystemExit(f'Unexpectedly few WEBP path changes: {len(webps)}')
          print(f'Exact scope validation passed: {len(webps)} WEBP path entries + index.html')
          PY
      - name: Commit stage 2 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html '*.webp'
          git commit -m "Normalize menu image filenames"
          git push origin stage2-image-rename-work
