name: Staff idempotency hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staff-idempotency-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden staff checkout request keys
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path('staff.html'), Path('staff-app/index.html')]

          old_key_fn = '''      function createIdempotencyKey() {
        if (globalThis.crypto?.randomUUID)
          return globalThis.crypto.randomUUID();
        return `web-${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
      }
'''

          new_key_fn = '''      function createIdempotencyKey() {
        if (globalThis.crypto?.randomUUID)
          return globalThis.crypto.randomUUID();

        if (globalThis.crypto?.getRandomValues) {
          const bytes = new Uint8Array(16);
          globalThis.crypto.getRandomValues(bytes);
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;
          const hex = Array.from(bytes, (byte) =>
            byte.toString(16).padStart(2, "0"),
          ).join("");
          return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
        }

        throw new Error("Secure random generation is unavailable.");
      }

      function checkoutRequestFingerprint(plan) {
        const welcomeCoffeeToggle = $("quickWelcomeCoffeeConfirmed");
        return JSON.stringify({
          memberId: String(member?.id || ""),
          billAmount: Number(plan.billAmount),
          selectedRewardId: String(plan.selectedRewardId || ""),
          breakfastConfirmed: $("quickBreakfastConfirmed").checked === true,
          welcomeCoffeeConfirmed: Boolean(welcomeCoffeeToggle?.checked),
          receiptReference: $("quickReceipt").value.trim(),
        });
      }

      function checkoutRequestKey(plan) {
        const fingerprint = checkoutRequestFingerprint(plan);
        if (
          !pendingCheckoutRequest ||
          pendingCheckoutRequest.fingerprint !== fingerprint
        ) {
          pendingCheckoutRequest = {
            fingerprint,
            key: createIdempotencyKey(),
          };
        }
        return pendingCheckoutRequest.key;
      }
'''

          for path in files:
            text = path.read_text(encoding='utf-8')

            email_matches = len(re.findall(r'value="qw\.co\.uk@gmail\.com"', text))
            if email_matches != 1:
              raise SystemExit(f'{path}: expected one default staff email, found {email_matches}')
            text = re.sub(r'\s*value="qw\.co\.uk@gmail\.com"', '', text, count=1)

            if text.count(old_key_fn) != 1:
              raise SystemExit(f'{path}: createIdempotencyKey block mismatch')
            text = text.replace(old_key_fn, new_key_fn, 1)

            state_line = '      let quickSelectionFromCustomer = false;\n'
            if text.count(state_line) != 1:
              raise SystemExit(f'{path}: quick checkout state marker mismatch')
            text = text.replace(
              state_line,
              state_line + '      let pendingCheckoutRequest = null;\n',
              1,
            )

            reset_marker = '      function resetMember() {\n'
            if text.count(reset_marker) != 1:
              raise SystemExit(f'{path}: resetMember marker mismatch')
            text = text.replace(
              reset_marker,
              reset_marker + '        pendingCheckoutRequest = null;\n',
              1,
            )

            handler_marker = '      $("completeCheckout").addEventListener('
            handler_start = text.find(handler_marker)
            if handler_start < 0:
              raise SystemExit(f'{path}: complete checkout handler missing')

            request_marker = 'action: "staff_complete_checkout"'
            request_start = text.find(request_marker, handler_start)
            if request_start < 0:
              raise SystemExit(f'{path}: staff_complete_checkout request missing')

            old_call = 'idempotencyKey: createIdempotencyKey(),'
            call_pos = text.find(old_call, request_start)
            catch_pos = text.find('          } catch (error) {', request_start)
            if call_pos < 0 or catch_pos < 0 or call_pos > catch_pos:
              raise SystemExit(f'{path}: checkout idempotency call mismatch')
            text = text[:call_pos] + 'idempotencyKey: checkoutRequestKey(plan),' + text[call_pos + len(old_call):]

            catch_pos = text.find('          } catch (error) {', request_start)
            text = text[:catch_pos] + '            pendingCheckoutRequest = null;\n' + text[catch_pos:]

            if 'Math.random()' in text:
              raise SystemExit(f'{path}: Math.random fallback still present')
            if 'qw.co.uk@gmail.com' in text:
              raise SystemExit(f'{path}: default staff email still present')
            if text.count('idempotencyKey: checkoutRequestKey(plan),') != 1:
              raise SystemExit(f'{path}: expected exactly one retry-stable checkout key')

            path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript and diff
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = [('staff.html', 'staff'), ('staff-app/index.html', 'staff-app')]
          for filename, prefix in targets:
            html = Path(filename).read_text(encoding='utf-8')
            scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.S | re.I)
            if not scripts:
              raise SystemExit(f'{filename}: no inline scripts found')
            for index, script in enumerate(scripts):
              Path(f'/tmp/{prefix}-{index}.js').write_text(script, encoding='utf-8')
          PY
          for file in /tmp/staff-*.js /tmp/staff-app-*.js; do node --check "$file"; done
          ! grep -R -n 'qw.co.uk@gmail.com' staff.html staff-app/index.html
          ! grep -R -n 'Math.random()' staff.html staff-app/index.html
          grep -R -n 'checkoutRequestKey(plan)' staff.html staff-app/index.html

      - name: Commit approved interface-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/staff-idempotency-hardening.yml
          git add staff.html staff-app/index.html
          git commit -m "Harden staff checkout idempotency"
          git push origin main
