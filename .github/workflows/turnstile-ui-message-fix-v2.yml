name: Turnstile UI Message Fix v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/turnstile-ui-message-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clear stale registration status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rewards.html')
          text = path.read_text(encoding='utf-8')
          target = '            renderPinResetWaiting("This number is already registered. Ask a member of staff to approve restoring your card.");\n'
          replacement = target + '            notice("formMessage", "", "info");\n'
          count = text.count(target)
          if count != 1:
              raise SystemExit(f'Expected target once, found {count}')
          path.write_text(text.replace(target, replacement, 1), encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('rewards.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.S | re.I)
          Path('/tmp/rewards-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/rewards-inline.js
          grep -n -A1 'This number is already registered' rewards.html | head -n 4

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rewards.html
          git commit -m "Clear stale registration message for existing members"
          git push origin main
