name: Staff idempotency hardening v2
on:
  push:
    branches: [main]
    paths:
      - scripts/patch-staff-idempotency.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/patch-staff-idempotency.py
      - run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for filename, prefix in [('staff.html','staff'),('staff-app/index.html','staff-app')]:
              html=Path(filename).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.S|re.I)
              for i,script in enumerate(scripts):
                  p=f'/tmp/{prefix}-{i}.js'; Path(p).write_text(script,encoding='utf-8'); subprocess.run(['node','--check',p],check=True)
          PY
          ! grep -R -n 'qw.co.uk@gmail.com' staff.html staff-app/index.html
          ! grep -R -n 'Math.random()' staff.html staff-app/index.html
          grep -R -n 'checkoutRequestKey(plan)' staff.html staff-app/index.html
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/staff-idempotency-hardening.yml .github/workflows/staff-idempotency-hardening-v2.yml scripts/patch-staff-idempotency.py
          git add staff.html staff-app/index.html
          git commit -m "Harden staff checkout idempotency"
          git push origin main
