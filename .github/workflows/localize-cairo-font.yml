name: Localize Cairo font
on:
  push:
    paths:
      - '.github/workflows/localize-cairo-font.yml'
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install font tooling
        run: python3 -m pip install --quiet fonttools brotli

      - name: Fetch and verify official Cairo source
        run: |
          set -euo pipefail
          mkdir -p assets/fonts
          curl -fL --retry 3 --retry-delay 2 \
            -o /tmp/Cairo.ttf \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf'
          curl -fL --retry 3 --retry-delay 2 \
            -o /tmp/Cairo-OFL.txt \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/OFL.txt'

          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha1
          from fontTools.ttLib import TTFont

          def git_blob_sha(data: bytes) -> str:
              return sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          source = Path('/tmp/Cairo.ttf').read_bytes()
          expected_font_blob = '25641b1c828857698457bcd9f5a102616b4e8033'
          actual_font_blob = git_blob_sha(source)
          if actual_font_blob != expected_font_blob:
              raise SystemExit(f'Official Cairo source SHA mismatch: {actual_font_blob}')

          license_bytes = Path('/tmp/Cairo-OFL.txt').read_bytes()
          expected_license_blob = 'f6e87d489b3f459dde4e0f457fdd63e1f39bfe67'
          actual_license_blob = git_blob_sha(license_bytes)
          if actual_license_blob != expected_license_blob:
              raise SystemExit(f'Cairo OFL SHA mismatch: {actual_license_blob}')

          font = TTFont('/tmp/Cairo.ttf')
          if 'fvar' not in font:
              raise SystemExit('Cairo source is not variable')
          axes = {axis.axisTag for axis in font['fvar'].axes}
          if 'wght' not in axes:
              raise SystemExit(f'Cairo weight axis missing: {sorted(axes)}')
          font.flavor = 'woff2'
          out = Path('assets/fonts/cairo-variable.woff2')
          font.save(out)

          check = TTFont(out)
          if 'fvar' not in check or 'wght' not in {a.axisTag for a in check['fvar'].axes}:
              raise SystemExit('WOFF2 conversion lost Cairo variable weight axis')
          if out.stat().st_size >= len(source):
              raise SystemExit('WOFF2 output was not smaller than source TTF')

          Path('assets/fonts/OFL-Cairo.txt').write_bytes(license_bytes)
          print(f'Cairo WOFF2 size: {out.stat().st_size} bytes')
          PY

      - name: Patch index and customer cache
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          external_lines = [
              '    <link rel="preconnect" href="https://fonts.googleapis.com">\n',
              '    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n',
              '    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">\n',
          ]
          for line in external_lines:
              if text.count(line) != 1:
                  raise SystemExit(f'Unexpected Cairo external link count: {line.strip()}')
              text = text.replace(line, '', 1)

          style_marker = '    <style>\n'
          if text.count(style_marker) != 1:
              raise SystemExit('Main style marker not found exactly once')

          font_face = '''    <style>\n        @font-face {\n            font-family: 'Cairo';\n            src: url('assets/fonts/cairo-variable.woff2') format('woff2');\n            font-style: normal;\n            font-weight: 200 1000;\n            font-display: swap;\n        }\n\n'''
          text = text.replace(style_marker, font_face, 1)

          if 'fonts.googleapis.com' in text or 'fonts.gstatic.com' in text:
              raise SystemExit('External Google Fonts reference remains in index.html')
          if text.count("assets/fonts/cairo-variable.woff2") != 1:
              raise SystemExit('Local Cairo reference count is not exactly one')
          index.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          sw_text = sw.read_text(encoding='utf-8')
          old_cache = 'const CACHE = "kweider-customer-v4.5.10";'
          new_cache = 'const CACHE = "kweider-customer-v4.5.11";'
          if sw_text.count(old_cache) != 1:
              raise SystemExit('Unexpected customer service-worker cache version')
          sw_text = sw_text.replace(old_cache, new_cache, 1)

          marker = '  "./logo.webp",\n'
          addition = '  "./assets/fonts/cairo-variable.woff2",\n'
          if sw_text.count(marker) != 1:
              raise SystemExit('Service-worker CORE insertion marker mismatch')
          if addition in sw_text:
              raise SystemExit('Cairo font already present in CORE cache')
          sw_text = sw_text.replace(marker, marker + addition, 1)
          sw.write_text(sw_text, encoding='utf-8')
          PY

      - name: Validate exact scope
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          from fontTools.ttLib import TTFont

          allowed = {
              'index.html',
              'service-worker.js',
              'assets/fonts/cairo-variable.woff2',
              'assets/fonts/OFL-Cairo.txt',
          }
          out = subprocess.check_output(['git', 'status', '--porcelain', '-uall'], text=True)
          changed = set()
          for line in out.splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.add(path)
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected:
              raise SystemExit(f'Unexpected changed files: {sorted(unexpected)}')
          if missing:
              raise SystemExit(f'Expected changed files missing: {sorted(missing)}')

          index = Path('index.html').read_text(encoding='utf-8')
          if 'fonts.googleapis.com' in index or 'fonts.gstatic.com' in index:
              raise SystemExit('Google Fonts dependency remains')
          if "font-display: swap;" not in index:
              raise SystemExit('font-display swap missing')

          sw = Path('service-worker.js').read_text(encoding='utf-8')
          if 'kweider-customer-v4.5.11' not in sw:
              raise SystemExit('New customer cache version missing')
          if './assets/fonts/cairo-variable.woff2' not in sw:
              raise SystemExit('Local Cairo not precached')

          font = TTFont('assets/fonts/cairo-variable.woff2')
          if 'fvar' not in font:
              raise SystemExit('Local Cairo WOFF2 is not variable')
          print('Cairo localization validation passed.')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js assets/fonts/cairo-variable.woff2 assets/fonts/OFL-Cairo.txt
          git commit -m "Self-host Cairo font for faster menu loading"
          git push origin main
