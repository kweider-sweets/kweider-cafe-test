name: Fix home burgundy contrast
on:
  push:
    paths:
      - '.github/workflows/fix-home-burgundy-contrast.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-burgundy-contrast-work
          fetch-depth: 0
      - name: Apply guarded patch
        run: python3 scripts/fix-home-burgundy-contrast.py
      - name: Validate scope
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          expected=$'index.html\nservice-worker.js'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi
          grep -F 'kweider-customer-v4.5.13' service-worker.js
          grep -F '#7A2030 0%' index.html
          grep -F '#681925 34%' index.html
          grep -F 'var(--menu-burgundy) 70%' index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          git commit -m "Strengthen home category burgundy contrast"
          git push origin home-burgundy-contrast-work
